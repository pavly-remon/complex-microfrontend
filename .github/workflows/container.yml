name: deploy-container

on:
  push:
    branches:
      - webpack
    paths:
      - "apps/container/**"

defaults:
  run:
    working-directory: apps/container

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
